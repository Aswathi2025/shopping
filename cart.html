<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Selection | Fashion Store</title>
    <meta name="description" content="View your cart on Fashion Store">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">Fashion Store</a></div>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="products.html">Collections</a>
            <a href="login.html">Sign In</a>
            <a href="wishlist.html">Wishlist <span class="wishlist-count cart-count" style="display:none;">0</span></a>
            <a href="cart.html" class="active">Cart <span class="cart-count">0</span></a>
        </nav>
    </header>

    <main class="page-main">
        <!-- Cart Section -->
        <section id="cart" class="cart-section section-padding">
            <h2>Your Selection</h2>
            <div class="cart-container">
                <div class="cart-items" id="cart-items-container">
                    <!-- Items will be injected by JavaScript -->
                </div>
                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-line">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="summary-line">
                        <span>Insured Shipping</span>
                        <span>Complimentary</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <button class="btn btn-primary btn-block" id="proceed-checkout-btn"
                        onclick="document.getElementById('checkout-form-container').style.display='block'; this.style.display='none';">Proceed
                        to Checkout</button>

                    <div id="checkout-form-container" style="display: none; margin-top: 2rem;">
                        <form class="checkout-form">
                            <h3 style="margin-top: 0;">Contact Information</h3>
                            <div class="form-group">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" name="name" placeholder="Eleanor Vance" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" name="email" placeholder="eleanor@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
                            </div>

                            <h3>Shipping Address</h3>
                            <div class="form-group">
                                <label for="address">Street Address</label>
                                <input type="text" id="address" name="address" placeholder="123 Luxury Ave" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="city">City</label>
                                    <input type="text" id="city" name="city" placeholder="New York" required>
                                </div>
                                <div class="form-group">
                                    <label for="zip">Zip Code</label>
                                    <input type="text" id="zip" name="zip" placeholder="10001" required>
                                </div>
                            </div>

                            <button type="button" class="btn btn-primary btn-block"
                                onclick="alert('Thank you for your order! Your timeless piece is being prepared.'); localStorage.removeItem('aura_cart'); window.location.href='index.html';">Confirm
                                Order & Pay</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">Fashion Store</div>
            <p>&copy; 2026 Fashion Store All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Jewellery Care</a>
            </div>
        </div>
    </footer>
    <script src="main.js"></script>
</body>

</html>
