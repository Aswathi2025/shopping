<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Fashion Store</title>
    <meta name="description" content="Sign in to your Fashion Store account.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">Fashion Store</a></div>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="jewellery.html">Jewellery</a>
            <a href="dresses.html">Dresses</a>
            <a href="login.html" class="active">Sign In</a>
            <a href="wishlist.html">Wishlist <span class="wishlist-count cart-count" style="display:none;">0</span></a>
            <a href="cart.html">Cart <span class="cart-count">0</span></a>

        </nav>
    </header>

    <main class="page-main">
        <!-- Login Section -->
        <section id="login" class="login-section section-padding">
            <div class="login-container">
                <div class="login-box">
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your Fashion Store account.</p>
                    <form class="login-form">
                        <div class="form-group">
                            <label for="login-email">Email Address</label>
                            <input type="email" id="login-email" placeholder="Email" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        <div class="login-options">
                            <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
                            <a href="register.html" class="create-account">Create Account</a>
                        </div>
                    </form>
                    <div id="login-error" style="color: #ef4444; margin-top: 1rem; font-size: 0.9rem; display: none;">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">Fashion Store</div>
            <p>&copy; 2026 Fashion Store All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Jewellery Care</a>
            </div>
        </div>
    </footer>
    <script src="main.js"></script>
    <script>
        document.querySelector('.login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');

            // Basic Validation
            if (!email || !password) {
                errorDiv.innerText = 'Please fill in all fields.';
                errorDiv.style.display = 'block';
                return;
            }

            // Simple email regex
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorDiv.innerText = 'Please enter a valid email address.';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            alert('Successfully signed in!');
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
